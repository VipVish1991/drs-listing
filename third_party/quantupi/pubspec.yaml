name: quantupi
description: Quantupi is a flutter plugin that allows users to start UPI payment apps on iOS and Android, and complete the payment.
version: 0.0.6
homepage: https://github.com/quantbugtechnology/quantpay.git
repository: https://github.com/quantbugtechnology/quantpay.git

environment:
  # Vendored locally (third_party/quantupi) — SDK constraint widened so the
  # host app (Dart 3.x) can depend on it as a path dependency.
  sdk: ">=2.17.1 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.quantupi
        pluginClass: QuantupiPlugin
      ios:
        pluginClass: QuantupiPlugin
