group 'com.az.upi_india'
version '1.0'

// Vendored into third_party/upi_india and patched for modern toolchains:
//  1. namespace added below (AGP 8 requirement — see comment).
//  2. UpiIndiaPlugin.java: removed the dead `import
//     PluginRegistry.Registrar;` (class removed in Flutter 3.35+).
//  3. The original buildscript/jcenter blocks were stripped — they were
//     ignored or dead (jcenter shut down) and are not needed for a
//     library subproject.
apply plugin: 'com.android.library'

android {
    // AGP 8 requires an explicit namespace (was previously inferred from
    // the AndroidManifest package attribute, which modern AGP forbids).
    namespace 'com.az.upi_india'
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}
