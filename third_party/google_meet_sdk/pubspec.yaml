name: google_meet_sdk
description: >-
  Vendored copy of google_meet_sdk 0.0.3 (upstream:
  https://github.com/shivbo96/google_meet_sdk). Upstream is unmaintained —
  it pins http ^0.13.5 and a Dart <3.0 SDK, which cannot resolve against
  this project (http ^1.3.0, Dart 3.10). The vendored copy patches:
    * SDK constraint raised to Dart 3.10 (pub resolution otherwise fails)
    * http upgraded to ^1.3.0, googleapis/firebase_auth/google_sign_in
      raised to versions compatible with firebase_core 4.x
    * platform_metadata removed — GoogleAuthentication.clientId /
      serverClientId are set by the host app instead of reading the
      Android manifest (that package is unmaintained and manifest reads
      are fragile)
    * GoogleAPIClient switched from http's IOClient to a plain
      BaseClient so the file compiles for web (the host app guards the
      SDK behind a conditional import; this just keeps the vendored
      source analyzable everywhere)
version: 0.0.3
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.5.0
  get: ^4.7.2
  google_sign_in: ^7.0.0
  googleapis: ^16.0.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
