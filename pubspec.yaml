name: DrsListing
description: "DrsListing - AI-Powered Healthcare Assistant & Doctor Discovery App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  get: ^4.7.2
  
  # Backend
  supabase_flutter: ^2.8.4
  
  # Maps & Location
  geolocator: ^13.0.2
  google_maps_flutter: ^2.12.0
  
  # Networking
  http: ^1.3.0
  http_parser: ^4.1.2
  
  # Speech
  speech_to_text: ^7.0.0
  record: ^5.2.0

  # Local Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.2

  # Deep Links (drslisting:// scheme — also used by supabase_flutter)
  app_links: ^7.0.0

  # UI
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  pin_code_fields: ^8.0.1
  introduction_screen: ^4.0.0

  # System UI (status bar / navigation bar color based on theme)
  flutter_statusbarcolor_ns: ^0.6.0


  # Permissions
  permission_handler: ^11.3.1
  geocoding: ^4.0.0
  flutter_dotenv: ^6.0.1

  # Share & QR
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  video_player: ^2.11.1
  flutter_tts: ^4.2.5
  image_picker: ^1.2.3
  image: ^4.8.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0
  connectivity_plus: ^7.3.1
  # Direct dep: web_connectivity_init.dart sets ConnectivityPlatform.instance
  # to the HTML plugin on web (already resolved transitively).
  connectivity_plus_platform_interface: ^2.1.0
  # Vendored (third_party/upi_india) — upstream 3.0.1 has a dead import
  # of PluginRegistry.Registrar (removed in Flutter 3.35+) that breaks the
  # Android build, and its Android module predates AGP 8's namespace
  # requirement. The vendored copy patches both. No code changes otherwise.
  upi_india:
    path: third_party/upi_india

# record_linux-0.7.2  needs record_platform_interface < 1.3.0
# record_web-1.3.0    needs record_platform_interface >= 1.3.0 (streamBufferSize)
# Pin both interface and web to versions that satisfy both sides.
dependency_overrides:
  record_platform_interface: 1.2.0
  record_web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only used in tests to fake the url_launcher platform (LaunchService tests).
  url_launcher_platform_interface: ^2.3.2
  # Only used in tests to fake image_picker's platform (gallery-pick tests).
  image_picker_platform_interface: ^2.10.1
  # Only used in tests to fake the video platform (avatar tap tests).
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/lottie/
    - assets/images/
    - assets/video/
    - .env
