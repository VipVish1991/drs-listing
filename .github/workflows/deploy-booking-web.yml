name: Deploy Booking Web

# Build the Flutter web app and push the output to the drsListing-web
# GitHub Pages repo. The drsListing-web repo's own pages.yml workflow
# then deploys the static files to GitHub Pages.
#
# This keeps the booking page (/#/web-booking) in sync with the latest
# Flutter code on every push to main.
#
# Required secret:
#   DEPLOY_PAT — a GitHub Personal Access Token (classic) with
#   "repo" scope, used to push to VipVish1991/drsListing-web.
#   Create one at https://github.com/settings/tokens → Generate new
#   token (classic) → select "repo" scope.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time.
concurrency:
  group: deploy-booking-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7

      - name: Install dependencies
        run: flutter pub get

      - name: Generate .env for build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            printf '%s\n' \
              "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" \
              "GROQ_API_KEY=$GROQ_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Flutter web
        run: flutter build web --release --base-href=/drsListing-web/

      - name: Clone drsListing-web repo
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          git clone https://oauth2:${DEPLOY_PAT}@github.com/VipVish1991/drsListing-web.git /tmp/drsListing-web

      - name: Sync build output to drsListing-web
        run: |
          TARGET="/tmp/drsListing-web"

          # Clear old Flutter build artifacts (keep .git, .github, .gitignore,
          # README, .nojekyll, booking.html, 404.html)
          cd "$TARGET"
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.gitignore' \
            ! -name 'README.md' \
            ! -name '.nojekyll' \
            ! -name 'booking.html' \
            ! -name '404.html' \
            -exec rm -rf {} +

          # Copy new build output
          cp -r ${{ github.workspace }}/build/web/* "$TARGET/"

          # Ensure .nojekyll exists (prevents Jekyll processing)
          touch "$TARGET/.nojekyll"

          # Keep 404.html as a copy of booking.html for legacy QR links
          cp "$TARGET/booking.html" "$TARGET/404.html"

      - name: Commit and push
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          cd /tmp/drsListing-web
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git commit -m "Auto-deploy: Flutter web build from DrsListing@${SHORT_SHA}
          
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          
          Generated by deploy-booking-web workflow"
          git push origin main
