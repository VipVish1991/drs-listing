name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: cancel an in-flight run if a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.7

      - name: Install dependencies
        run: flutter pub get

      - name: Generate .env for build
        # .env is gitignored (contains real API keys), so a fresh checkout
        # has none — and flutter build fails when a declared asset is
        # missing. Inject the keys from repo secrets when configured;
        # otherwise fall back to the placeholder template so the build
        # still succeeds (app boots, but API-backed features need secrets).
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Note: every line of the script is at the same indent so the
        # heredoc terminator (EOF) lands at column 0 after YAML dedent.
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
          cat > .env <<EOF
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          OPENAI_API_KEY=$OPENAI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          EOF
          else
          cp .env.example .env
          fi

      - name: Build web
        # GitHub Pages project site: served under /drs-listing/, so the
        # base href must match or assets 404.
        run: flutter build web --release --base-href=/drs-listing/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
